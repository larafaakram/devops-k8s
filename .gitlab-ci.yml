stages:
# My pipeline
  - build
  - push
  - deliver

Build:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  tags:
    - docker
  before_script:
    #- echo "192.168.1.230 gitlab.project.com" >> /etc/hosts
    - docker login -u "$CI_REGISTRY_USER" -p $CI_REGISTRY_PASSWORD
  script:
    - cd microservices/auth
    - docker build -t $CI_REGISTRY_USER/weatherapp-auth . --no-cache
    - cd ../UI
    - docker build -t $CI_REGISTRY_USER/weatherapp-ui .
    - docker ../weather
    - docker build -t $CI_REGISTRY_USER/weatherapp-weather .
  rules:
    - if: $CI_COMMIT_TAG == "null"
push:
  image: docker:latest
  stage: push
  tags:
    - docker
  services:
    - docker:dind
  before_script:
    - echo "192.168.1.230 gitlab.project.com" >> /etc/hosts
    - unset DOCKER_HOST
    - docker login -u "$CI_REGISTRY_USER" -p $CI_REGISTRY_PASSWORD
  script:
    - cd microservices/auth
    - docker build -t $CI_REGISTRY_USER/weatherapp-auth:$CI_COMMIT_SHA . --no-cache
    - docker push $CI_REGISTRY_USER/weatherapp-auth:$CI_COMMIT_SHA
    - cd ../UI
    - docker build -t $CI_REGISTRY_USER/weatherapp-ui:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_USER/weatherapp-ui:$CI_COMMIT_SHA
    - cd ../weather
    - docker build -t $CI_REGISTRY_USER/weatherapp-weather:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_USER/weatherapp-weather:$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"

  
deliver:
  stage: deliver
  image:
    name: alpine/helm:latest
    entrypoint: [""]
  tags:
    - docker
  before_script:
    #- apk add py3-pip
    #- pip3 install awscli
    #- aws configure set region "us-east-1"
    - mkdir $HOME/.kube
    - echo $configkube | base64 -d > $HOME/.kube/config
    - chmod go-r $HOME/.kube/config
    - ls -la $HOME/.kube/config
    - cat $HOME/.kube/config
    - helm repo add bitnami https://charts.bitnami.com/bitnami
  script:
    - cd helm/weather/weatherapp-auth

  only: 
    - main